experiment:
  name: plantseg_rmi_resnet

dataset:
  name: plantseg
  root: ../plantseg
  manifest: ../plantseg/main.json
  batch_dir: plantseg
  caption_index: 3
  vocab_path: outputs/plantseg_artifacts/vocab_caption3.txt

model:
  name: rmi_resnet101
  input_size: 320
  num_steps: 64
  visual_dim: 2048
  word_embed_dim: 1000
  rnn_hidden_dim: 1000
  mlp_dim: 500
  backbone_weights: IMAGENET1K_V2

training:
  batch_size: 1
  epochs: 50
  learning_rate: 0.00025
  min_learning_rate: 0.00001
  weight_decay: 0.0005
  num_workers: 0
  seed: 42
  device: cuda

evaluation:
  threshold: 0.5
  export_test_masks: true

outputs:
  root: outputs/plantseg_rmi_resnet
  checkpoint_best: outputs/plantseg_rmi_resnet/checkpoint_best.pt
  checkpoint_last: outputs/plantseg_rmi_resnet/checkpoint_last.pt
  metrics_dir: outputs/plantseg_rmi_resnet/metrics
  test_mask_dir: outputs/plantseg_rmi_resnet/test_masks
